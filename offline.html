<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Mode — Premiumhub</title>
  <meta name="theme-color" content="#6C3BFF">
  <link rel="manifest" href="./pwa/main.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/premiumhub-192.png">
  <link rel="icon" type="image/png" href="./assets/icons/premiumhub-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;padding:20px;">

  <div class="card" style="max-width: 440px; text-align: center; padding: 40px 24px;">
    <img src="./assets/icons/premiumhub-192.png" alt="Premiumhub" style="width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 16px;">
    
    <div style="display:inline-block;padding:4px 12px;background:#FEF3C7;color:#D97706;border-radius:9999px;font-size:0.8rem;font-weight:700;margin-bottom:12px;">
      ⚡ You're currently offline
    </div>

    <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--color-text-main); margin-bottom: 8px;">No Internet Connection</h1>
    <p style="color: var(--color-text-sub); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5;">
      Premiumhub is saved on your device, but active network connectivity is needed to load live prices and submit orders.
    </p>

    <button onclick="window.location.reload()" class="btn btn-primary btn-block">
      ↻ Retry Connection
    </button>
  </div>

</body>
</html>
