<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — Premiumhub</title>
  <meta name="theme-color" content="#6C3BFF">
  <link rel="manifest" href="./pwa/main.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/premiumhub-192.png">
  <link rel="icon" type="image/png" href="./assets/icons/premiumhub-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/install.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <div style="display:flex;align-items:center;gap:12px;">
        <button onclick="window.history.back()" class="icon-btn" aria-label="Go Back">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </button>
        <a href="./index.html" class="brand">
          <img src="./assets/icons/premiumhub-192.png" alt="Premiumhub" class="brand-logo-img">
          <span class="brand-text">Premiumhub</span>
        </a>
      </div>
      <div id="auth-header-slot">
        <a href="./login.html" class="header-btn header-btn-primary">Sign In</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 24px 16px 48px;">
    <div id="product-details-container">
      <div class="card" style="max-width: 800px; margin: 0 auto;">
        <div class="skeleton" style="height: 320px; margin-bottom: 20px;"></div>
        <div class="skeleton" style="height: 30px; width: 60%; margin-bottom: 12px;"></div>
        <div class="skeleton" style="height: 20px; width: 40%; margin-bottom: 24px;"></div>
        <div class="skeleton" style="height: 50px;"></div>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-nav">
    <a href="./index.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Home</span>
    </a>
    <a href="./my-orders.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      <span>My Orders</span>
    </a>
    <a href="./search.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <span>Search</span>
    </a>
    <a href="./settings.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <script type="module" src="./js/install.js"></script>
  <script type="module" src="./js/support-widget.js"></script>
  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import { getProductById, formatPrice } from "./js/products.js";

    onAuthStateChanged(auth, (user) => {
      const slot = document.getElementById("auth-header-slot");
      if (!slot) return;
      if (user) {
        slot.innerHTML = `
          <a href="./profile.html" class="header-btn header-btn-ghost">
            <div style="width:28px;height:28px;border-radius:50%;background:var(--color-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;">
              ${(user.displayName || user.email || 'U')[0].toUpperCase()}
            </div>
            <span>Profile</span>
          </a>
        `;
      }
    });

    async function loadProduct() {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");
      const container = document.getElementById("product-details-container");

      if (!productId) {
        container.innerHTML = `<div class="card" style="text-align:center;padding:48px;"><h3 style="font-size:1.2rem;font-weight:700;">No product specified</h3><a href="./index.html" class="btn btn-primary" style="margin-top:16px;">Back to Shop</a></div>`;
        return;
      }

      const product = await getProductById(productId);
      if (!product) {
        container.innerHTML = `<div class="card" style="text-align:center;padding:48px;"><h3 style="font-size:1.2rem;font-weight:700;">Product not found or removed</h3><a href="./index.html" class="btn btn-primary" style="margin-top:16px;">Back to Shop</a></div>`;
        return;
      }

      document.title = `${product.name} — Premiumhub`;

      container.innerHTML = `
        <div class="card" style="max-width: 860px; margin: 0 auto; overflow: hidden; padding: 0;">
          <div style="display: grid; grid-template-columns: 1fr; gap: 0;">
            <div style="background: #f7f6fd; position: relative; max-height: 420px; overflow: hidden; display:flex; align-items:center; justify-content:center;">
              <img src="${product.image || 'https://images.unsplash.com/photo-1526738549149-8e07eca6c147?auto=format&fit=crop&w=800&q=80'}" alt="${product.name}" style="width:100%; height:100%; max-height: 400px; object-fit: contain;">
              <span class="product-badge-avail ${product.available ? '' : 'product-badge-out'}" style="position:absolute;top:16px;right:16px;padding:6px 12px;font-size:0.85rem;">
                ${product.available ? 'In Stock' : 'Out of Stock'}
              </span>
            </div>

            <div style="padding: 24px 24px 32px; display:flex; flex-direction:column; gap:16px;">
              <div>
                <span style="font-size:0.8rem;font-weight:700;color:var(--color-primary);background:var(--color-light-purple);padding:4px 10px;border-radius:9999px;">
                  ${product.category || 'Digital Good'}
                </span>
                <h1 style="font-size:1.6rem;font-weight:800;color:var(--color-text-main);margin-top:8px;line-height:1.25;">
                  ${product.name}
                </h1>
              </div>

              <div style="display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);padding:14px 0;">
                <span style="font-size:2rem;font-weight:800;color:var(--color-primary);">${formatPrice(product.price)}</span>
                ${product.oldPrice ? `<span style="font-size:1.1rem;color:var(--color-text-sub);text-decoration:line-through;">${formatPrice(product.oldPrice)}</span>` : ''}
              </div>

              <div>
                <h3 style="font-size:1rem;font-weight:700;margin-bottom:6px;">Description & Plan Features</h3>
                <p style="color:var(--color-text-main);font-size:0.95rem;line-height:1.6;white-space:pre-line;">
                  ${product.description || 'Full warranty, official license, and instant automated credentials delivery upon payment verification.'}
                </p>
              </div>

              <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px;">
                <a href="./checkout.html?id=${product.id}" class="btn btn-primary btn-lg btn-block" style="${product.available ? '' : 'pointer-events:none;opacity:0.5;'}">
                  ${product.available ? 'Buy Now — Instant Checkout →' : 'Currently Unavailable'}
                </a>
                <button onclick="window.history.back()" class="btn btn-outline btn-block">
                  ← Back to Store
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    loadProduct();
  </script>
</body>
</html>
