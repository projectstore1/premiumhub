<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — PHAdmin Portal</title>
  <meta name="theme-color" content="#4B22CC">
  <link rel="manifest" href="/pwa/admin.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/phadmin-192.png">
  <link rel="icon" type="image/png" href="/assets/icons/phadmin-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body style="background: radial-gradient(circle at top, #1E173D 0%, #0F0C20 100%); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;">

  <div class="card" style="max-width: 440px; text-align: center; padding: 40px 24px; border-radius: 20px;">
    <img src="/assets/icons/phadmin-192.png" alt="PHAdmin" style="width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 16px;">
    
    <div style="display:inline-block;padding:4px 12px;background:#FEF3C7;color:#D97706;border-radius:9999px;font-size:0.8rem;font-weight:700;margin-bottom:12px;">
      ⚡ Admin Network Offline
    </div>

    <h1 style="font-size: 1.4rem; font-weight: 800; color: #171329; margin-bottom: 8px;">PHAdmin Offline</h1>
    <p style="color: #77718A; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5;">
      You are disconnected from the network. Live order moderation, payment verification, and Firestore database modifications require an internet connection.
    </p>

    <button onclick="window.location.reload()" class="btn btn-primary btn-block" style="background: linear-gradient(135deg, #4B22CC, #6C3BFF);">
      ↻ Reconnect & Refresh Dashboard
    </button>
  </div>

</body>
</html>
