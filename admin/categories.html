  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left">
        <button id="admin-menu-toggle" class="menu-toggle-btn" aria-label="Toggle Sidebar">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span style="font-weight:700;color:var(--admin-text-main);">Product Categories</span>
      </div>
    </header>

    <main class="admin-content">
      <div style="display:grid;grid-template-columns:1fr;gap:24px;">
        <!-- Add Category Form -->
        <div class="card" style="max-width:540px;">
          <h3 style="font-size:1.15rem;font-weight:800;margin-bottom:14px;">Add New Category</h3>
          <form id="add-category-form">
            <div class="form-group">
              <label class="form-label">Category Name</label>
              <input type="text" id="cat-name-input" class="form-input" placeholder="e.g. Cloud & Hosting" required>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">+ Create Category</button>
          </form>
        </div>

        <!-- Categories Table -->
        <div class="table-card">
          <div class="table-header">
            <h3 style="font-size:1.15rem;font-weight:800;">Existing Store Categories</h3>
          </div>
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Category Name</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="categories-tbody">
                <tr><td colspan="3" style="text-align:center;padding:20px;">Loading categories...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../js/install.js"></script>
  <script type="module">
    import { verifyAdminAuth, initAdminSidebar } from "../js/admin.js";
    import { db } from "../js/firebase-config.js";
    import { collection, getDocs, addDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
    import { showToast } from "../js/auth.js";

    async function init() {
      const authResult = await verifyAdminAuth();
      if (!authResult) return;
      initAdminSidebar();
      loadCategories();

      document.getElementById("add-category-form")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("cat-name-input").value.trim();
        try {
          await addDoc(collection(db, "categories"), {
            name,
            active: true,
            createdAt: serverTimestamp()
          });
          showToast("Category created!", "success");
          document.getElementById("add-category-form").reset();
          loadCategories();
        } catch (err) {
          showToast(err.message || "Failed", "error");
        }
      });
    }

    async function loadCategories() {
      const tbody = document.getElementById("categories-tbody");
      if (!tbody) return;

      try {
        const snap = await getDocs(collection(db, "categories"));
        const defaultCats = ["Entertainment", "AI & Tools", "Design", "Finance", "Education"];
        let list = [];

        snap.forEach(d => list.push({ id: d.id, ...d.data() }));

        if (list.length === 0) {
          tbody.innerHTML = defaultCats.map(c => `
            <tr>
              <td style="font-weight:700;">${c}</td>
              <td><span class="badge badge-confirmed">Active</span></td>
              <td><span style="font-size:0.8rem;color:var(--admin-text-sub);">Default system category</span></td>
            </tr>
          `).join("");
          return;
        }

        tbody.innerHTML = list.map(c => `
          <tr>
            <td style="font-weight:700;">${c.name}</td>
            <td><span class="badge badge-confirmed">Active</span></td>
            <td>
              <button class="del-cat-btn btn-sm" data-id="${c.id}" style="background:#FEE2E2;color:#DC2626;border-radius:6px;font-weight:600;padding:4px 10px;">Delete</button>
            </td>
          </tr>
        `).join("");

        document.querySelectorAll(".del-cat-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            if (confirm("Delete category?")) {
              await deleteDoc(doc(db, "categories", btn.dataset.id));
              showToast("Category removed", "info");
              loadCategories();
            }
          });
        });
      } catch (e) {
        console.error(e);
      }
    }

    init();
  </script>
