<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHAdmin — Administration Portal Sign In</title>
  <meta name="theme-color" content="#4B22CC">
  <link rel="manifest" href="../pwa/admin.webmanifest">
  <link rel="apple-touch-icon" href="../assets/icons/phadmin-192.png">
  <link rel="icon" type="image/png" href="../assets/icons/phadmin-192.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/install.css">
</head>
<body style="background: radial-gradient(circle at top, #1E173D 0%, #0F0C20 100%); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;">

  <div class="card" style="max-width: 440px; width: 100%; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); background: #FFFFFF; padding: 36px 28px;">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <img src="../assets/icons/phadmin-192.png" alt="PHAdmin Logo" style="width: 68px; height: 68px; border-radius: 16px; margin: 0 auto 12px; box-shadow: 0 8px 24px rgba(75,34,204,0.35);">
      <h1 style="font-size: 1.55rem; font-weight: 800; color: #171329;">PHAdmin Portal</h1>
      <p style="font-size: 0.85rem; color: #77718A; margin-top: 4px;">Premiumhub Management & Control Panel</p>
    </div>

    <!-- Sign In / Register Admin Toggle -->
    <div style="display:flex;background:#F3EEFF;padding:4px;border-radius:10px;margin-bottom:20px;">
      <button type="button" id="tab-admin-login" style="flex:1;padding:8px;border:none;border-radius:8px;font-weight:700;font-size:0.85rem;cursor:pointer;background:#6C3BFF;color:#FFF;">Sign In</button>
      <button type="button" id="tab-admin-reg" style="flex:1;padding:8px;border:none;border-radius:8px;font-weight:700;font-size:0.85rem;cursor:pointer;background:transparent;color:#4B22CC;">Register Admin</button>
    </div>

    <form id="admin-login-form">
      <div class="form-group" id="admin-name-group" style="display:none;">
        <label class="form-label">Administrator Full Name</label>
        <input type="text" id="admin-name" class="form-input" placeholder="MD ABDULLAH">
      </div>

      <div class="form-group">
        <label class="form-label">Administrator Email</label>
        <input type="email" id="admin-email" class="form-input" placeholder="admin@premiumhub.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="admin-pass" class="form-input" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" id="admin-submit-btn" class="btn btn-primary btn-block" style="margin-top: 14px; background: linear-gradient(135deg, #4B22CC, #6C3BFF);">
        Enter PHAdmin Dashboard →
      </button>
    </form>

    <div style="margin-top: 24px; padding: 12px; background: #F8F7FC; border-radius: 10px; font-size: 0.8rem; color: #77718A; text-align: center; border: 1px solid #E8E5F2;">
      🔐 <strong>Security Enforcement:</strong> Only authorized administrator credentials have access to order management, payment verification, and system settings.
    </div>

    <div style="text-align: center; margin-top: 16px;">
      <a href="../index.html" style="font-size: 0.85rem; color: #6C3BFF; font-weight: 600;">← Return to Premiumhub Store</a>
    </div>

  </div>

  <script type="module" src="../js/install.js"></script>
  <script type="module">
    import { auth } from "../js/firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import { verifyAdminAuth } from "../js/admin.js";
    import { showToast } from "../js/auth.js";

    let isRegisterMode = false;

    const tabLogin = document.getElementById("tab-admin-login");
    const tabReg = document.getElementById("tab-admin-reg");
    const nameGroup = document.getElementById("admin-name-group");
    const submitBtn = document.getElementById("admin-submit-btn");

    tabLogin?.addEventListener("click", () => {
      isRegisterMode = false;
      tabLogin.style.background = "#6C3BFF";
      tabLogin.style.color = "#FFF";
      tabReg.style.background = "transparent";
      tabReg.style.color = "#4B22CC";
      nameGroup.style.display = "none";
      submitBtn.textContent = "Enter PHAdmin Dashboard →";
    });

    tabReg?.addEventListener("click", () => {
      isRegisterMode = true;
      tabReg.style.background = "#6C3BFF";
      tabReg.style.color = "#FFF";
      tabLogin.style.background = "transparent";
      tabLogin.style.color = "#4B22CC";
      nameGroup.style.display = "block";
      submitBtn.textContent = "Create Master Admin & Enter →";
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const adminResult = await verifyAdminAuth();
        if (adminResult && adminResult.isAdmin) {
          window.location.href = "./dashboard.html";
        }
      }
    });

    document.getElementById("admin-login-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("admin-email").value.trim();
      const pass = document.getElementById("admin-pass").value;
      const name = document.getElementById("admin-name")?.value.trim() || "Administrator";

      submitBtn.disabled = true;
      submitBtn.textContent = isRegisterMode ? "Provisioning Admin..." : "Verifying Credentials...";

      try {
        if (isRegisterMode) {
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          await updateProfile(cred.user, { displayName: name }).catch(() => {});
          showToast("Admin account registered successfully!", "success");
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }

        const adminResult = await verifyAdminAuth();
        if (adminResult && adminResult.isAdmin) {
          showToast("Welcome to PHAdmin!", "success");
          setTimeout(() => {
            window.location.href = "./dashboard.html";
          }, 300);
        } else {
          showToast("Account does not have admin permissions", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = isRegisterMode ? "Create Master Admin & Enter →" : "Enter PHAdmin Dashboard →";
        }
      } catch (err) {
        showToast(err.message || "Authentication error", "error");
        submitBtn.disabled = false;
        submitBtn.textContent = isRegisterMode ? "Create Master Admin & Enter →" : "Enter PHAdmin Dashboard →";
      }
    });
  </script>
</body>
</html>
