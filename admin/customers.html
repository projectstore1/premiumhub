  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left">
        <button id="admin-menu-toggle" class="menu-toggle-btn" aria-label="Toggle Sidebar">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span style="font-weight:700;color:var(--admin-text-main);">Customers & Profile UIDs Directory</span>
      </div>
    </header>

    <main class="admin-content">
      <div class="table-card">
        <div class="table-header">
          <div class="admin-search-box" style="width:100%;max-width:380px;">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="search" id="cust-search" placeholder="Search by numeric Profile UID, name, email...">
          </div>
        </div>

        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Profile UID</th>
                <th>Full Name</th>
                <th>Email Address</th>
                <th>WhatsApp</th>
                <th>Account Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customers-tbody">
              <tr><td colspan="7" style="text-align:center;padding:24px;">Loading customers...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/install.js" defer></script>
  <script type="module">
    import { verifyAdminAuth, initAdminSidebar } from "/js/admin.js";
    import { db } from "/js/firebase-config.js";
    import { collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
    import { showToast } from "/js/auth.js";

    let customerList = [];

    async function init() {
      const authResult = await verifyAdminAuth();
      if (!authResult) return;
      initAdminSidebar();
      await loadCustomers();

      document.getElementById("cust-search")?.addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        const filtered = customerList.filter(c => 
          (c.profileUID || '').toString().includes(q) ||
          (c.displayName || '').toLowerCase().includes(q) ||
          (c.email || '').toLowerCase().includes(q)
        );
        render(filtered);
      });
    }

    async function loadCustomers() {
      try {
        const snap = await getDocs(collection(db, "users"));
        customerList = [];
        snap.forEach(d => customerList.push({ id: d.id, ...d.data() }));
        render(customerList);
      } catch (err) {
        console.error(err);
      }
    }

    function render(list) {
      const tbody = document.getElementById("customers-tbody");
      if (!tbody) return;

      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--admin-text-sub);">No customers found matching query.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(c => `
        <tr>
          <td>
            <span style="font-weight:800;color:var(--admin-primary);background:var(--admin-light-purple);padding:4px 10px;border-radius:6px;font-family:monospace;font-size:0.95rem;">
              #${c.profileUID || 'None'}
            </span>
          </td>
          <td style="font-weight:700;">${c.displayName || 'Customer'}</td>
          <td>${c.email}</td>
          <td>${c.whatsapp || 'N/A'}</td>
          <td><span style="text-transform:uppercase;font-size:0.75rem;font-weight:700;letter-spacing:0.5px;">${c.role || 'customer'}</span></td>
          <td>
            <span class="badge ${c.disabled ? 'badge-rejected' : 'badge-confirmed'}">
              ${c.disabled ? 'Disabled' : 'Active'}
            </span>
          </td>
          <td>
            <button class="toggle-user-btn btn-sm" data-id="${c.id}" data-disabled="${c.disabled || false}" style="background:${c.disabled ? '#DCFCE7' : '#FEE2E2'};color:${c.disabled ? '#16A34A' : '#DC2626'};border-radius:6px;font-weight:600;padding:4px 10px;">
              ${c.disabled ? 'Re-enable' : 'Disable'}
            </button>
          </td>
        </tr>
      `).join("");

      document.querySelectorAll(".toggle-user-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const currentDisabled = btn.dataset.disabled === "true";
          try {
            await updateDoc(doc(db, "users", btn.dataset.id), { disabled: !currentDisabled });
            showToast(`Account ${!currentDisabled ? 'disabled' : 'enabled'}`, "info");
            await loadCustomers();
          } catch (e) {
            showToast("Failed to toggle account", "error");
          }
        });
      });
    }

    init();
  </script>
</body>
