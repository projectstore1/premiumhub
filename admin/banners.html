<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <aside class="admin-sidebar" id="admin-sidebar">

      <a href="./dashboard.html" class="sidebar-brand">

        <div class="sidebar-brand-title">
          <span>PHAdmin</span>
          <span class="sidebar-brand-subtitle">Admin Panel</span>

    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">Store Management</div>
      <a href="./dashboard.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="./products.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <span>Products</span>
      </a>
      <a href="./orders.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
        <span>Orders & Verification</span>
      </a>

      <div class="nav-section-title">Marketing & Content</div>
      <a href="./banners.html" class="sidebar-nav-item active">
        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Banners & Carousel</span>
      </a>
      <a href="./media.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span>Media Library</span>
      </a>

      <div class="nav-section-title">Configuration</div>
      <a href="./payments.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        <span>Payment Methods</span>
      </a>
      <a href="./settings.html" class="sidebar-nav-item">
        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span>Website & Telegram</span>
      </a>
    </nav>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left">
        <button id="admin-menu-toggle" class="menu-toggle-btn" aria-label="Toggle Sidebar">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span style="font-weight:700;color:var(--admin-text-main);">Promotional Banners Carousel</span>
      </div>
    </header>

    <main class="admin-content">
      <div style="display:grid;grid-template-columns:1fr;gap:24px;">
        <!-- Add Banner Form -->
        <div class="card" style="max-width:600px;">
          <h3 style="font-size:1.15rem;font-weight:800;margin-bottom:14px;">Add New Carousel Slide</h3>
          <form id="add-banner-form">
            <div class="form-group">
              <label class="form-label">Banner Title *</label>
              <input type="text" id="banner-title" class="form-input" placeholder="e.g. 50% Off Annual Subscriptions" required>
            </div>
            <div class="form-group">
              <label class="form-label">Subtitle / Description</label>
              <input type="text" id="banner-subtitle" class="form-input" placeholder="Limited time offer for crypto & Naira payments.">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div class="form-group">
                <label class="form-label">Badge Label</label>
                <input type="text" id="banner-badge" class="form-input" placeholder="HOT DEAL">
              </div>
              <div class="form-group">
                <label class="form-label">Target Link</label>
                <input type="text" id="banner-link" class="form-input" placeholder="#products">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Background Image URL *</label>
              <input type="url" id="banner-image" class="form-input" placeholder="https://images.unsplash.com/..." required>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">+ Save Banner Slide</button>
          </form>
        </div>

        <!-- Banners List -->
        <div class="card">
          <h3 style="font-size:1.15rem;font-weight:800;margin-bottom:14px;">Active Promotional Banners</h3>
          <div id="banner-list">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../js/install.js"></script>
  <script type="module">
    import { verifyAdminAuth, initAdminSidebar } from "../js/admin.js";
    import { initAdminSettingsPage } from "../js/admin-settings.js";

    async function init() {
      const authResult = await verifyAdminAuth();
      if (!authResult) return;
      initAdminSidebar();
      initAdminSettingsPage();
    }

    init();
  </script>
</body>
</html>
