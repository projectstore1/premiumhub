<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile — Premiumhub</title>
  <meta name="theme-color" content="#6C3BFF">
  <link rel="manifest" href="/pwa/main.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/premiumhub-192.png">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/install.css">

<body>

  <header class="header">

      <div style="display:flex;align-items:center;gap:12px;">

        <a href="/" class="brand">

      </div>
      <div>
        <a href="/my-orders.html" class="header-btn header-btn-ghost">My Orders</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 24px 16px 80px;">
    <div id="profile-content">
      <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="skeleton" style="height: 60px; margin-bottom: 20px;"></div>
        <div class="skeleton" style="height: 40px; margin-bottom: 14px;"></div>
        <div class="skeleton" style="height: 40px; margin-bottom: 14px;"></div>
        <div class="skeleton" style="height: 50px;"></div>
      </div>
    </div>
