<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Successful — Premiumhub</title>
  <meta name="theme-color" content="#6C3BFF">
  <link rel="manifest" href="./pwa/main.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/premiumhub-192.png">
  <link rel="icon" type="image/png" href="./assets/icons/premiumhub-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/install.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="./index.html" class="brand">
        <img src="./assets/icons/premiumhub-192.png" alt="Premiumhub" class="brand-logo-img">
        <span class="brand-text">Premiumhub</span>
      </a>
      <div>
        <a href="./my-orders.html" class="header-btn header-btn-ghost">My Orders</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 40px 16px 80px;">
    <div class="card" style="max-width: 640px; margin: 0 auto; text-align: center; padding: 36px 24px;" id="success-card">
      <div style="width: 72px; height: 72px; background: #DCFCE7; color: #16A34A; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
        <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
      </div>

      <h1 style="font-size: 1.7rem; font-weight: 800; color: var(--color-text-main); margin-bottom: 8px;">Order Received!</h1>
      <p style="color: var(--color-text-sub); font-size: 0.95rem; margin-bottom: 24px;">
        Thank you for choosing Premiumhub. Your order has been registered and queued for verification.
      </p>

      <div id="order-summary-box" style="background: #F8F7FC; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 20px; text-align: left; margin-bottom: 24px;">
        <div class="skeleton" style="height: 120px;"></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <a href="" id="invoice-btn-link" class="btn btn-primary btn-block">
          View & Download Official Invoice →
        </a>
        <div style="display: flex; gap: 10px;">
          <a href="./my-orders.html" class="btn btn-secondary" style="flex:1;">View My Orders</a>
          <a href="./index.html" class="btn btn-outline" style="flex:1;">Return to Shop</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./js/install.js"></script>
  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
    import { formatPrice } from "./js/products.js";

    async function loadSuccessDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get("id");
      const summaryBox = document.getElementById("order-summary-box");
      const invLink = document.getElementById("invoice-btn-link");

      if (!orderId) {
        window.location.href = "./index.html";
        return;
      }

      if (invLink) {
        invLink.href = `./invoice.html?id=${encodeURIComponent(orderId)}`;
      }

      try {
        const snap = await getDoc(doc(db, "orders", orderId));
        if (!snap.exists()) {
          summaryBox.innerHTML = `<p style="color:red;">Order data could not be retrieved.</p>`;
          return;
        }

        const o = snap.data();
        summaryBox.innerHTML = `
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid #E6E4F0;padding-bottom:12px;margin-bottom:12px;">
            <span style="font-size:0.85rem;color:var(--color-text-sub);">Order ID:</span>
            <span style="font-weight:800;color:var(--color-primary);">${o.orderId}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:0.85rem;color:var(--color-text-sub);">Product:</span>
            <span style="font-weight:700;">${o.productName}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:0.85rem;color:var(--color-text-sub);">Amount:</span>
            <span style="font-weight:800;color:var(--color-primary);font-size:1.1rem;">${formatPrice(o.price)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:0.85rem;color:var(--color-text-sub);">Payment Method:</span>
            <span style="font-weight:600;font-size:0.9rem;">${o.paymentMethod}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:0.85rem;color:var(--color-text-sub);">Reference:</span>
            <span style="font-family:monospace;font-size:0.85rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;">${o.transactionReference}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="font-size:0.85rem;color:var(--color-text-sub);">Payment Status:</span>
            <span class="badge badge-unverified">${o.paymentStatus || 'Unverified'}</span>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span style="font-size:0.85rem;color:var(--color-text-sub);">Order Status:</span>
            <span class="badge badge-processing">${o.orderStatus || 'Pending'}</span>
          </div>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    loadSuccessDetails();
  </script>
</body>
</html>
