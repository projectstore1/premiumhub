<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Premiumhub</title>
  <meta name="theme-color" content="#6C3BFF">
  <link rel="manifest" href="./pwa/main.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/premiumhub-192.png">
  <link rel="icon" type="image/png" href="./assets/icons/premiumhub-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/install.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="./index.html" class="brand">
          <img src="./assets/icons/premiumhub-192.png" alt="Premiumhub" class="brand-logo-img">
          <span class="brand-text">Premiumhub</span>
        </a>
      </div>
      <div id="auth-header-slot">
        <a href="./login.html" class="header-btn header-btn-primary">Sign In</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 24px 16px 80px;">
    <div style="max-width: 860px; margin: 0 auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <div>
          <h1 style="font-size:1.6rem;font-weight:800;color:var(--color-text-main);">My Orders</h1>
          <p style="font-size:0.88rem;color:var(--color-text-sub);">Track your purchase history and instant delivery statuses.</p>
        </div>
        <a href="./index.html" class="btn btn-secondary btn-sm">+ Shop More</a>
      </div>

      <div id="orders-list-container" style="display:flex;flex-direction:column;gap:16px;">
        <div class="skeleton" style="height:140px;border-radius:14px;"></div>
        <div class="skeleton" style="height:140px;border-radius:14px;"></div>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-nav">
    <a href="./index.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Home</span>
    </a>
    <a href="./my-orders.html" class="mobile-nav-item active">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      <span>My Orders</span>
    </a>
    <a href="./search.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <span>Search</span>
    </a>
    <a href="./settings.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <script type="module" src="./js/install.js"></script>
  <script type="module" src="./js/support-widget.js"></script>
  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import { subscribeCustomerOrders, getStatusBadge } from "./js/orders.js";
    import { formatPrice } from "./js/products.js";

    const container = document.getElementById("orders-list-container");

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = `./login.html?redirect=./my-orders.html`;
        return;
      }

      const slot = document.getElementById("auth-header-slot");
      if (slot) {
        slot.innerHTML = `<a href="./profile.html" class="header-btn header-btn-ghost">${user.displayName || 'Profile'}</a>`;
      }

      subscribeCustomerOrders(user.uid, (orders) => {
        if (!orders.length) {
          container.innerHTML = `
            <div class="card" style="text-align:center;padding:48px 20px;">
              <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin:0 auto 12px;color:var(--color-text-sub);"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
              <h3 style="font-size:1.15rem;font-weight:700;">You have no orders yet</h3>
              <p style="color:var(--color-text-sub);font-size:0.9rem;margin-top:4px;">Browse our catalog and grab your favorite subscription today.</p>
              <a href="./index.html" class="btn btn-primary" style="margin-top:16px;">Start Shopping</a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(o => {
          const dateStr = o.createdAt?.seconds 
            ? new Date(o.createdAt.seconds * 1000).toLocaleDateString()
            : 'Recent';

          return `
            <div class="card" style="padding:18px 20px;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--color-border);padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
                <div>
                  <div style="font-weight:800;color:var(--color-primary);font-size:1rem;">Order #${o.orderId}</div>
                  <div style="font-size:0.78rem;color:var(--color-text-sub);">Placed on: ${dateStr} • UID: #${o.profileUID || 'N/A'}</div>
                </div>
                <div style="display:flex;gap:6px;align-items:center;">
                  ${getStatusBadge(o.paymentStatus || 'Unverified')}
                  ${getStatusBadge(o.orderStatus || 'Pending')}
                </div>
              </div>

              <div style="display:flex;gap:14px;align-items:center;">
                <img src="${o.productImage || 'https://images.unsplash.com/photo-1526738549149-8e07eca6c147?auto=format&fit=crop&w=120&q=80'}" style="width:58px;height:58px;border-radius:10px;object-fit:cover;" alt="">
                <div style="flex:1;">
                  <h4 style="font-size:1rem;font-weight:700;color:var(--color-text-main);">${o.productName}</h4>
                  <div style="font-size:0.8rem;color:var(--color-text-sub);margin-top:2px;">
                    Method: ${o.paymentMethod || 'Crypto/Bank'} • Ref: <span style="font-family:monospace;">${(o.transactionReference || '').slice(0, 16)}...</span>
                  </div>
                </div>
                <div style="text-align:right;">
                  <div style="font-size:1.15rem;font-weight:800;color:var(--color-primary);">${formatPrice(o.price)}</div>
                </div>
              </div>

              <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;border-top:1px solid var(--color-border);padding-top:12px;">
                <a href="./invoice.html?id=${o.orderId}" class="btn btn-outline btn-sm">
                  View Invoice 📄
                </a>
              </div>
            </div>
          `;
        }).join("");
      });
    });
  </script>
</body>
</html>
